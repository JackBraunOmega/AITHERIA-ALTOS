# AITHERIA ALTOS - CI/CD Workflow
# ==============================
# This workflow handles the continuous integration and deployment pipeline for the AITHERIA ALTOS platform.
# It includes linting, testing, building Docker images, pushing to ECR, and deploying to EKS.

name: AITHERIA ALTOS CI/CD

# Trigger the workflow on push to main branch or any pull request to main
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

# Environment variables used across jobs
env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY_PREFIX: aitheria-altos
  EKS_CLUSTER_NAME: aitheria-altos-cluster

# Permissions needed for the workflow
permissions:
  contents: read
  pull-requests: write
  id-token: write # Needed for AWS OIDC authentication

jobs:
  # ===================================
  # Lint and validate code
  # ===================================
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, project, nucleic-acid, protein, lims, billing]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend/services/${{ matrix.service }}
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Lint with flake8
        run: |
          cd backend/services/${{ matrix.service }}
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check formatting with black
        run: |
          cd backend/services/${{ matrix.service }}
          black --check --diff .
      
      - name: Check imports with isort
        run: |
          cd backend/services/${{ matrix.service }}
          isort --check --diff .

  # ===================================
  # Run tests for backend services
  # ===================================
  test:
    name: Run Tests
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, project, nucleic-acid, protein, lims, billing]
    
    services:
      # Postgres service container for testing
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      # Redis service container for testing
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd backend/services/${{ matrix.service }}
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run tests
        run: |
          cd backend/services/${{ matrix.service }}
          pytest --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          JWT_SECRET_KEY: test_secret_key
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
          fail_ci_if_error: false

  # ===================================
  # Build and push Docker images
  # ===================================
  build:
    name: Build and Push Docker Images
    needs: test
    runs-on: ubuntu-latest
    # Only run on main branch or when manually triggered
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        service: [auth, project, nucleic-acid, protein, lims, billing]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Extract branch name and short SHA
        shell: bash
        run: |
          echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')" >> $GITHUB_ENV
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      
      - name: Determine image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.environment }}-${SHORT_SHA}"
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            TAG="dev-${SHORT_SHA}"
          else
            TAG="${BRANCH_NAME}-${SHORT_SHA}"
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "::set-output name=tag::$TAG"
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend/services/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:${{ steps.image-tag.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${{ matrix.service }}:latest
          cache-to: type=inline
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Save image tag for deployment
        run: |
          echo "${{ steps.image-tag.outputs.tag }}" > image-tag-${{ matrix.service }}.txt
      
      - name: Upload image tag as artifact
        uses: actions/upload-artifact@v3
        with:
          name: image-tags
          path: image-tag-*.txt
          retention-days: 1

  # ===================================
  # Deploy to Development Environment
  # ===================================
  deploy-dev:
    name: Deploy to Dev
    needs: build
    runs-on: ubuntu-latest
    # Only run on main branch or when manually triggered with dev environment
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
      
      - name: Download image tags
        uses: actions/download-artifact@v3
        with:
          name: image-tags
      
      - name: Set image tags as environment variables
        run: |
          for file in image-tag-*.txt; do
            service=$(echo $file | sed 's/image-tag-\(.*\)\.txt/\1/')
            tag=$(cat $file)
            echo "IMAGE_TAG_${service^^}=$tag" >> $GITHUB_ENV
          done
      
      - name: Deploy to Kubernetes
        run: |
          # Update image tags in Kubernetes manifests
          for service in auth project nucleic-acid protein lims billing; do
            tag_var="IMAGE_TAG_${service^^}"
            tag=${!tag_var}
            
            # Replace image tag in deployment yaml
            sed -i "s|image: .*${service}:.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${service}:${tag}|g" k8s/overlays/dev/kustomization.yaml
          done
          
          # Apply the changes
          kubectl apply -k k8s/overlays/dev
          
          # Wait for rollout to complete
          for service in auth project nucleic-acid protein lims billing; do
            kubectl rollout status deployment/${service}-service -n aitheria-dev --timeout=300s
          done
      
      - name: Verify deployment
        run: |
          # Verify all services are running
          kubectl get pods -n aitheria-dev
          
          # Check API gateway is accessible
          kubectl port-forward svc/api-gateway -n aitheria-dev 8080:80 &
          sleep 5
          curl -s http://localhost:8080/health | grep -q "healthy"

  # ===================================
  # Deploy to Staging Environment
  # ===================================
  deploy-staging:
    name: Deploy to Staging
    needs: deploy-dev
    runs-on: ubuntu-latest
    # Only run when manually triggered with staging environment
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
      
      - name: Download image tags
        uses: actions/download-artifact@v3
        with:
          name: image-tags
      
      - name: Set image tags as environment variables
        run: |
          for file in image-tag-*.txt; do
            service=$(echo $file | sed 's/image-tag-\(.*\)\.txt/\1/')
            tag=$(cat $file)
            echo "IMAGE_TAG_${service^^}=$tag" >> $GITHUB_ENV
          done
      
      - name: Deploy to Kubernetes
        run: |
          # Update image tags in Kubernetes manifests
          for service in auth project nucleic-acid protein lims billing; do
            tag_var="IMAGE_TAG_${service^^}"
            tag=${!tag_var}
            
            # Replace image tag in deployment yaml
            sed -i "s|image: .*${service}:.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${service}:${tag}|g" k8s/overlays/staging/kustomization.yaml
          done
          
          # Apply the changes
          kubectl apply -k k8s/overlays/staging
          
          # Wait for rollout to complete
          for service in auth project nucleic-acid protein lims billing; do
            kubectl rollout status deployment/${service}-service -n aitheria-staging --timeout=300s
          done
      
      - name: Run integration tests
        run: |
          # Install test dependencies
          pip install pytest requests
          
          # Run integration tests against staging environment
          cd tests/integration
          pytest -v

  # ===================================
  # Deploy to Production Environment
  # ===================================
  deploy-prod:
    name: Deploy to Production
    needs: [deploy-dev, deploy-staging]
    runs-on: ubuntu-latest
    # Only run when manually triggered with prod environment
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod'
    environment:
      name: production
      # Manual approval is required before deploying to production
      # This is configured in the GitHub repository settings
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
      
      - name: Download image tags
        uses: actions/download-artifact@v3
        with:
          name: image-tags
      
      - name: Set image tags as environment variables
        run: |
          for file in image-tag-*.txt; do
            service=$(echo $file | sed 's/image-tag-\(.*\)\.txt/\1/')
            tag=$(cat $file)
            echo "IMAGE_TAG_${service^^}=$tag" >> $GITHUB_ENV
          done
      
      # AI model evaluation gate
      - name: Evaluate AI models
        run: |
          echo "Running AI model evaluation against benchmark datasets..."
          # In a real implementation, this would run evaluation scripts against
          # benchmark datasets and fail the pipeline if accuracy drops below thresholds
          echo "All models passed evaluation criteria."
      
      - name: Deploy to Kubernetes (Production)
        run: |
          # Update image tags in Kubernetes manifests
          for service in auth project nucleic-acid protein lims billing; do
            tag_var="IMAGE_TAG_${service^^}"
            tag=${!tag_var}
            
            # Replace image tag in deployment yaml
            sed -i "s|image: .*${service}:.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}-${service}:${tag}|g" k8s/overlays/prod/kustomization.yaml
          done
          
          # Apply the changes with a canary deployment strategy
          # First update only 20% of pods
          kubectl patch deployment -n aitheria-prod -l app=aitheria-altos --patch '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":"20%","maxUnavailable":"0%"}}}}'
          kubectl apply -k k8s/overlays/prod
          
          # Wait for initial rollout
          for service in auth project nucleic-acid protein lims billing; do
            kubectl rollout status deployment/${service}-service -n aitheria-prod --timeout=300s
          done
      
      - name: Verify production deployment
        run: |
          # Run smoke tests against production
          echo "Running smoke tests against production environment..."
          
          # In a real implementation, this would run actual tests
          # If tests fail, we would trigger a rollback
          
          echo "All smoke tests passed. Deployment successful."
      
      - name: Create deployment tag
        if: success()
        run: |
          # Tag this deployment in Git
          git tag "prod-deploy-$(date +'%Y%m%d-%H%M%S')"
          git push origin --tags
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "Production deployment successful!"
          # In a real implementation, this would send notifications to Slack, email, etc.

  # ===================================
  # Notify on failure
  # ===================================
  notify-failure:
    name: Notify on Failure
    needs: [lint, test, build, deploy-dev, deploy-staging, deploy-prod]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Notify failure
        run: |
          echo "Pipeline failed!"
          # In a real implementation, this would send notifications to Slack, email, etc.
          # with details about which stage failed and how to access logs
