version: '3.8'

services:
  # PostgreSQL Database for Auth Service
  postgres:
    image: postgres:15-alpine
    container_name: aitheria-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aitheria_auth}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - aitheria-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis for caching and token blocklist
  redis:
    image: redis:7-alpine
    container_name: aitheria-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - aitheria-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Auth Service microservice
  auth-service:
    build:
      context: ./backend/services/auth
      dockerfile: Dockerfile
    container_name: aitheria-auth-service
    volumes:
      - ./backend/services/auth:/app
      - auth_service_logs:/app/logs
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aitheria_auth}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super_secret_key_change_in_production}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:-admin@aitheria-altos.com}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-Admin123!}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-"http://localhost:3000,http://localhost:8080"}
      API_V1_STR: /api/v1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aitheria-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # API Gateway (nginx)
  api-gateway:
    image: nginx:alpine
    container_name: aitheria-api-gateway
    volumes:
      - ./infrastructure/docker/nginx/conf.d:/etc/nginx/conf.d
      - ./infrastructure/docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - api_gateway_logs:/var/log/nginx
    ports:
      - "8080:80"
    depends_on:
      - auth-service
    networks:
      - aitheria-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  aitheria-network:
    driver: bridge

volumes:
  postgres_data:
    name: aitheria-postgres-data
  redis_data:
    name: aitheria-redis-data
  auth_service_logs:
    name: aitheria-auth-service-logs
  api_gateway_logs:
    name: aitheria-api-gateway-logs
