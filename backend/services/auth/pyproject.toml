[tool.poetry]
name = "aitheria-altos-auth-service"
version = "0.1.0"
description = "Authentication and authorization microservice for AITHERIA ALTOS platform"
authors = ["AITHERIA ALTOS Team <info@aitheria-altos.com>"]
license = "Proprietary"
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
pydantic = "^2.4.2"
pydantic-settings = "^2.0.3"
starlette = "^0.27.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
sqlalchemy = "^2.0.23"
alembic = "^1.12.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.28.0"
pyjwt = "^2.8.0"
authlib = "^1.2.1"
itsdangerous = "^2.1.2"
httpx = "^0.25.1"
oauthlib = "^3.2.2"
python-dotenv = "^1.0.0"
redis = "^5.0.1"
aioredis = "^2.0.1"
loguru = "^0.7.2"
cryptography = "^41.0.5"
bcrypt = "^4.0.1"
email-validator = "^2.1.0.post1"
tenacity = "^8.2.3"
pytz = "^2023.3.post1"
opentelemetry-api = "^1.20.0"
opentelemetry-sdk = "^1.20.0"
opentelemetry-instrumentation-fastapi = "^0.41b0"
prometheus-client = "^0.17.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
black = "^23.10.1"
flake8 = "^6.1.0"
isort = "^5.12.0"
mypy = "^1.6.1"
pre-commit = "^3.5.0"
asgi-lifespan = "^2.1.0"
httpx = "^0.25.1"
faker = "^19.12.0"
factory-boy = "^3.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_mode = "auto"
