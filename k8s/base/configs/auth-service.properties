# =================================================================
# AITHERIA ALTOS - Auth Service Configuration Properties
# =================================================================
# This file contains configuration properties for the Auth Service
# in the AITHERIA ALTOS Biotechnology SaaS Platform.
# =================================================================

# ----------------------
# Service Information
# ----------------------
service.name=auth-service
service.description=Authentication and authorization service for AITHERIA ALTOS platform
service.version=0.1.0
service.documentation.url=/docs
service.health.enabled=true
service.metrics.enabled=true

# ----------------------
# API Configuration
# ----------------------
api.version=/api/v1
api.prefix=/api/v1/auth
api.rate-limit.enabled=true
api.rate-limit.requests=100
api.rate-limit.period=60
api.cors.enabled=true
api.docs.enabled=true
api.docs.path=/docs
api.docs.title=AITHERIA ALTOS Auth Service API
api.docs.description=API for authentication and authorization in the AITHERIA ALTOS platform

# ----------------------
# Database Configuration
# ----------------------
# Note: Actual connection strings are provided via environment variables
db.type=postgresql
db.pool.size=20
db.pool.max-overflow=10
db.pool.timeout=30
db.echo=false
db.migration.enabled=true
db.migration.auto=true

# ----------------------
# Redis Configuration
# ----------------------
redis.pool.size=10
redis.token.prefix=token:blocklist:
redis.session.prefix=session:
redis.rate-limit.prefix=rate-limit:

# ----------------------
# Authentication Settings
# ----------------------
auth.jwt.algorithm=HS256
auth.jwt.access-token.expire-minutes=30
auth.jwt.refresh-token.expire-days=7
auth.password.min-length=8
auth.password.require-uppercase=true
auth.password.require-lowercase=true
auth.password.require-digit=true
auth.password.require-special=true
auth.bcrypt.rounds=12
auth.lockout.max-attempts=5
auth.lockout.duration-minutes=30

# ----------------------
# Session Settings
# ----------------------
session.cookie.name=aitheria_session
session.cookie.httponly=true
session.cookie.samesite=lax
session.cookie.max-age=604800
session.use-refresh-token-cookie=true

# ----------------------
# Feature Flags
# ----------------------
feature.mfa.enabled=false
feature.sso.enabled=true
feature.social-login.enabled=true
feature.audit-log.enabled=true
feature.password-history.enabled=true
feature.password-expiry.enabled=true

# ----------------------
# Compliance Settings
# ----------------------
compliance.hipaa.enabled=true
compliance.fda-21-cfr-part-11.enabled=true
compliance.audit.immutable=true
compliance.audit.retention-days=3650
compliance.data-encryption.at-rest=true
compliance.data-encryption.in-transit=true
compliance.electronic-signatures.enabled=true

# ----------------------
# Logging Configuration
# ----------------------
logging.level=INFO
logging.format=json
logging.output=file,console
logging.file.path=/app/logs/auth-service.log
logging.file.max-size=100MB
logging.file.max-history=30
logging.request.enabled=true
logging.sensitive-fields=password,token,secret,key,authorization

# ----------------------
# Monitoring & Metrics
# ----------------------
metrics.enabled=true
metrics.endpoint=/metrics
metrics.collection-interval=15
metrics.include-jvm=true
metrics.include-system=true
metrics.include-db-pool=true
metrics.include-http=true

# ----------------------
# Performance Tuning
# ----------------------
performance.thread-pool.core-size=10
performance.thread-pool.max-size=50
performance.thread-pool.queue-size=100
performance.cache.enabled=true
performance.cache.ttl-seconds=300
performance.request-timeout=30
performance.connection-timeout=10

# ----------------------
# Integration Settings
# ----------------------
integration.notification.enabled=true
integration.notification.endpoint=${NOTIFICATION_SERVICE_URL:http://notification-service/api/v1/notifications}
integration.audit.enabled=true
integration.audit.endpoint=${AUDIT_SERVICE_URL:http://audit-service/api/v1/audit-logs}
