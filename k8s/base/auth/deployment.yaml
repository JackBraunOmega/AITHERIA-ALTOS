apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    service: auth
    tier: backend
spec:
  selector:
    matchLabels:
      service: auth
  # Define deployment strategy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Default replicas (will be overridden in overlays)
  replicas: 1
  template:
    metadata:
      labels:
        service: auth
        tier: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: auth-service-sa
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
      - name: auth-service
        image: aitheria-altos-auth:latest  # Will be patched in overlays
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        # Environment variables
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: ENVIRONMENT
        - name: API_V1_STR
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: API_V1_STR
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: auth-service-config
              key: LOG_LEVEL
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: REDIS_URL
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: JWT_SECRET_KEY
        - name: FIRST_SUPERUSER
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: FIRST_SUPERUSER
              optional: true
        - name: FIRST_SUPERUSER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-service-secrets
              key: FIRST_SUPERUSER_PASSWORD
              optional: true
        # Health checks
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 2
        # Resource limits
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Volume mounts
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
            - ALL
      # Volumes
      volumes:
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: auth-service-config
      # Pod scheduling rules
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: service
                  operator: In
                  values:
                  - auth
              topologyKey: kubernetes.io/hostname
      # Tolerations for node taints
      tolerations:
      - key: "backend"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      # Termination grace period
      terminationGracePeriodSeconds: 30
