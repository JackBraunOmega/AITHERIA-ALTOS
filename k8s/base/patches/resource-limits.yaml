apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-important
spec:
  template:
    spec:
      containers:
      - name: not-important
        resources:
          # Default resource limits for microservices
          # These can be overridden in environment-specific overlays
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
# High-resource services (AI/ML components)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-important
  labels:
    resource-profile: high
spec:
  template:
    spec:
      containers:
      - name: not-important
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi
---
# Medium-resource services (data processing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-important
  labels:
    resource-profile: medium
spec:
  template:
    spec:
      containers:
      - name: not-important
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
---
# Low-resource services (simple APIs)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: not-important
  labels:
    resource-profile: low
spec:
  template:
    spec:
      containers:
      - name: not-important
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
