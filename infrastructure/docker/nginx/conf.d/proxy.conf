# AITHERIA ALTOS - Common Proxy Configuration
# ===========================================
# This file contains common proxy settings for all microservices
# behind the API Gateway. It's included in each location block
# that proxies requests to a microservice.

# Pass client information to backend services
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;

# Pass the original request ID or generate a new one
proxy_set_header X-Request-ID $request_id;

# Timeouts
proxy_connect_timeout 10s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# Buffering settings
proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
proxy_temp_file_write_size 32k;

# WebSocket support
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection "upgrade";

# Don't close upstream connections on client disconnect
proxy_ignore_client_abort on;

# Enable keepalive connections to upstream servers
proxy_socket_keepalive on;

# Disable proxy caching for dynamic content
proxy_cache off;
proxy_no_cache 1;
proxy_cache_bypass 1;

# Redirect all HTTP errors from upstream
proxy_intercept_errors on;

# Handle upstream connection errors
proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
proxy_next_upstream_tries 3;
proxy_next_upstream_timeout 15s;

# Don't pass Authorization header to upstream
proxy_set_header Authorization "";

# Don't pass cookies to upstream by default
# Uncomment if needed:
# proxy_pass_request_headers on;
